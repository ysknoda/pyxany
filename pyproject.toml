[build-system]
requires = ["hatchling>=1.27"]   # 1.27: PEP 639 license / license-files
build-backend = "hatchling.build"

[project]
name = "pyxany"
version = "0.2.0a3"
description = "DV-Xalpha (Discrete Variational Xalpha) all-electron molecular orbital code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yusuke Noda" }]
keywords = ["DV-Xalpha", "quantum chemistry", "electronic structure",
            "density functional theory", "semiconductor clusters"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",   # scipy.integrate.lebedev_rule
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Compiled (threaded) kernels for the grid, Hartree and force hot spots. Without it the
# pure-numpy path runs and gives the same numbers (tested to 1e-12), only slower.
fast = ["numba>=0.59"]
# Domain decomposition of the DV grid under mpirun. Without it every run is serial.
mpi  = ["mpi4py>=3.1"]
# Summary and bonding figures. Without it `pyxany run` skips them with a note.
plot = ["matplotlib>=3.7"]
all  = ["pyxany[fast,mpi,plot]"]
# Test suite and lint. ruff is pinned to a minor series so a new release cannot add
# rules that turn CI red (ADR 0012, F2).
dev  = ["pytest>=8", "pytest-cov", "ruff>=0.16,<0.17"]

[project.scripts]
pyxany = "pyxany.cli:main"

[project.urls]
Homepage = "https://github.com/ysknoda/pyxany"
Repository = "https://github.com/ysknoda/pyxany"
Issues = "https://github.com/ysknoda/pyxany/issues"

[tool.hatch.build.targets.wheel]
# Everything under pyxany/ ships, including the data/tables/*.json tables --
# hatchling includes non-Python files inside a listed package directory.  Do not
# add a force-include for the tables as well: that maps them to a path the
# package entry already claims and the wheel build aborts on the duplicate.
packages = ["pyxany"]

[tool.hatch.build.targets.sdist]
include = ["pyxany", "tests", "docs", "examples", "tools", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "mpi: requires running under mpirun with >1 rank",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]  # ambiguous variable name 'l' -- standard for angular momentum

[tool.ruff.lint.per-file-ignores]
# zip(strict=...) is not supported inside numba-compiled functions.
"pyxany/kernels/numba_impl.py" = ["B905"]
