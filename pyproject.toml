[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyxany"
version = "0.1.0"
description = "DV-Xalpha (Discrete Variational Xalpha) all-electron molecular orbital code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Yusuke Noda" }]
keywords = ["DV-Xalpha", "quantum chemistry", "electronic structure",
            "density functional theory", "semiconductor clusters"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
mpi  = ["mpi4py>=3.1"]
plot = ["matplotlib>=3.7"]
all  = ["pyxany[fast,mpi,plot]"]
dev  = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
pyxany = "pyxany.cli:main"

[project.urls]
Homepage = "https://github.com/yusuke/pyxany"
Issues = "https://github.com/yusuke/pyxany/issues"

[tool.hatch.build.targets.wheel]
# Everything under pyxany/ ships, including the data/tables/*.json tables --
# hatchling includes non-Python files inside a listed package directory.  Do not
# add a force-include for the tables as well: that maps them to a path the
# package entry already claims and the wheel build aborts on the duplicate.
packages = ["pyxany"]

[tool.hatch.build.targets.sdist]
include = ["pyxany", "tests", "docs", "examples", "tools", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "mpi: requires running under mpirun with >1 rank",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]  # ambiguous variable name 'l' -- standard for angular momentum
