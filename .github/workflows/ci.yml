name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The slow tests + MPI job runs only when started by hand (Actions tab, or
  # `gh workflow run ci.yml`): ~20 minutes, too costly for every push (ADR 0014).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # The numba and pure-numpy paths must agree, so both are exercised.
        backend: [numba, numpy]
    name: py${{ matrix.python-version }} / ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.backend }}" = "numba" ]; then
            pip install -e ".[dev,fast,plot]"
          else
            pip install -e ".[dev,plot]"
          fi
      - name: Lint
        run: ruff check pyxany tests tools
      - name: Test
        env:
          PYXANY_DISABLE_NUMBA: ${{ matrix.backend == 'numpy' && '1' || '0' }}
        run: pytest -q -m "not slow and not mpi"

  slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: slow tests + MPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast,mpi,plot]"
      - name: Slow tests
        run: pytest -q -m slow
      - name: MPI tests
        run: pytest -q -m mpi

  package:
    runs-on: ubuntu-latest
    name: build + install wheel
    # The test jobs above install with `-e`, which never exercises the wheel
    # archive builder.  A non-editable build is the only thing that catches a
    # broken file mapping (e.g. a table included twice at the same path), so it
    # gets its own job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Data tables must be inside the wheel
        run: |
          python - <<'PY'
          import glob, pathlib, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          tables = sorted(n for n in names if n.startswith("pyxany/data/tables/"))
          print(f"{wheel}: {len(tables)} data tables")
          for n in tables:
              print("   ", n)
          # Compare against the tables in the source tree rather than a fixed count,
          # which went stale when ADR 0011 added two (ADR 0012, F1).
          expected = sorted("pyxany/data/tables/" + p.name
                            for p in pathlib.Path("pyxany/data/tables").glob("*.json"))
          if tables != expected:
              sys.exit(f"wheel tables differ from the source tree:\n"
                       f"  missing: {sorted(set(expected) - set(tables))}\n"
                       f"  extra:   {sorted(set(tables) - set(expected))}")
          PY
      - name: Install the built wheel and smoke-test the CLI
        run: |
          python -m pip install dist/*.whl
          mkdir -p /tmp/smoke && cd /tmp/smoke   # no source tree on the path
          pyxany info
          pyxany basis dz
          cp "$GITHUB_WORKSPACE"/examples/h2o.yaml "$GITHUB_WORKSPACE"/examples/h2o.xyz .
          pyxany run h2o.yaml
