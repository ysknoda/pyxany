name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # The numba and pure-numpy paths must agree, so both are exercised.
        backend: [numba, numpy]
    name: py${{ matrix.python-version }} / ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.backend }}" = "numba" ]; then
            pip install -e ".[dev,fast,plot]"
          else
            pip install -e ".[dev,plot]"
          fi
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          DVXA_DISABLE_NUMBA: ${{ matrix.backend == 'numpy' && '1' || '0' }}
        run: pytest -q -m "not slow and not mpi"

  slow:
    runs-on: ubuntu-latest
    name: slow tests + MPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast,mpi,plot]"
      - name: Slow tests
        run: pytest -q -m slow
      - name: MPI tests
        run: pytest -q -m mpi
