# rock salt: six-fold coordination gives alpha = 1/3, not the tetrahedral 1/2
# Relax only the terminators with:  pyxany opt mgo6h.yaml --freeze-core
molecule:
  name: mgo6h
  structure: mgo6h.xyz
  charge: 0
  mult: 1
  units: angstrom
basis:
  set: dz
grid:
  n_r: 30
  n_a: 12
  poisson_l_max: auto
scf:
  max_iter: 150
  e_tol: 1.0e-06
  d_tol: 1.0e-05
  alpha: 0.7
forces:
  enabled: true
  method: analytic
properties:
  population: true
  dipole: true
output:
  dir: ./results
  prefix: mgo6h
  figure: true
  json: true
passivation:
  scheme: pseudo_hydrogen
  species:
    HO:
      passivates: O
      role: anion
      Z_val: 6
      coordination: 6
      alpha: 0.33333333
  basis: derived
optimize:
  enabled: false
  freeze: core
  f_max: 0.001
  max_steps: 60
