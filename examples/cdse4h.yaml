# II-VI: Se terminators carry alpha = 1/2
# Relax only the terminators with:  pyxany opt cdse4h.yaml --freeze-core
molecule:
  name: cdse4h
  structure: cdse4h.xyz
  charge: 0
  mult: 1
  units: angstrom
basis:
  set: dz
grid:
  n_r: 30
  n_a: 12
  poisson_l_max: auto
scf:
  max_iter: 150
  e_tol: 1.0e-06
  d_tol: 1.0e-05
  alpha: 0.7
forces:
  enabled: true
  method: analytic
properties:
  population: true
  dipole: true
output:
  dir: ./results
  prefix: cdse4h
  figure: true
  json: true
passivation:
  species:
    HSe:
      passivates: Se
      role: anion
      Z_val: 6
      coordination: 4
      alpha: 0.5
optimize:
  enabled: false
  freeze: core
  f_max: 0.001
  max_steps: 60
