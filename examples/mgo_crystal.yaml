# Rock-salt MgO for 'pyxany embed mgo_crystal.yaml -o mg19o6_charges.xyz'.
# a = 4.21 A = 2 x the Mg-O distance of mgo6h.xyz / mg19o6.xyz (2.105 A); the
# room-temperature experimental value is about 4.211 A (UNCERTAIN: quoted from
# memory -- check against a crystallographic source before production use).
lattice:
  - [4.21, 0.0, 0.0]
  - [0.0, 4.21, 0.0]
  - [0.0, 0.0, 4.21]
sites:                      # [label, fractional x, y, z, formal charge]
  - [Mg, 0.0, 0.0, 0.0, +2]
  - [Mg, 0.5, 0.5, 0.0, +2]
  - [Mg, 0.5, 0.0, 0.5, +2]
  - [Mg, 0.0, 0.5, 0.5, +2]
  - [O,  0.5, 0.0, 0.0, -2]
  - [O,  0.0, 0.5, 0.0, -2]
  - [O,  0.0, 0.0, 0.5, -2]
  - [O,  0.5, 0.5, 0.5, -2]
origin: [0.0, 0.0, 0.0]     # the central Mg of mg19o6.xyz sits on fractional (0, 0, 0)
cells: 3                    # Evjen block 7 cells wide centred on the central Mg
cluster: mg19o6.xyz
