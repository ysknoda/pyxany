molecule:
  name: co
  structure: co.xyz
  charge: 0
  mult: 1
  units: angstrom
basis:
  set: dz
grid:
  n_r: 30
  n_a: 12
  poisson_l_max: auto
scf:
  max_iter: 150
  e_tol: 1.0e-06
  d_tol: 1.0e-05
  alpha: 0.7
forces:
  enabled: true
  method: analytic
properties:
  population: true
  dipole: true
output:
  dir: ./results
  prefix: co
  figure: true
  json: true
