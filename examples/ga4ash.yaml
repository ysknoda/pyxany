# III-V: As terminators carry alpha = 3/4
# Relax only the terminators with:  pyxany opt ga4ash.yaml --freeze-core
molecule:
  name: ga4ash
  structure: ga4ash.xyz
  charge: 0
  mult: 1
  units: angstrom
basis:
  set: dz
grid:
  n_r: 30
  n_a: 12
  poisson_l_max: auto
scf:
  max_iter: 150
  e_tol: 1.0e-06
  d_tol: 1.0e-05
  alpha: 0.7
forces:
  enabled: true
  method: analytic
properties:
  population: true
  dipole: true
output:
  dir: ./results
  prefix: ga4ash
  figure: true
  json: true
passivation:
  scheme: pseudo_hydrogen
  species:
    HAs:
      passivates: As
      role: anion
      Z_val: 5
      coordination: 4
      alpha: 0.75
  basis: derived
optimize:
  enabled: false
  freeze: core
  f_max: 0.001
  max_steps: 60
